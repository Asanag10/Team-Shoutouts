openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /slack/status:
    get:
      operationId: getSlackStatus
      summary: Get the Slack bot connection state
      responses:
        "200":
          description: Current connection state, without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlackStatus"
components:
  schemas:
    SlackStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [unconfigured, connecting, connected, disconnected, error]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

